name: Discord Notify

on:
  push:
    branches: [ main, master ]
  release:
    types: [published]

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Send Discord notification
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        shell: bash
        run: |
          set -Eeuo pipefail
          trap 'echo "❌ Failed at line $LINENO"; exit 2' ERR

          echo "EVENT=${{ github.event_name }}"
          echo "REPO=${{ github.repository }}"
          echo "REF=${{ github.ref }}"
          echo "REF_NAME=${{ github.ref_name }}"

          if [ -z "${DISCORD_WEBHOOK_URL:-}" ]; then
            echo "ERROR: Missing DISCORD_WEBHOOK_URL secret"
            exit 2
          fi

          echo "Installing jq..."
          sudo apt-get update -y
          sudo apt-get install -y jq

          EVENT="${{ github.event_name }}"
          REPO="${{ github.repository }}"
          ACTOR="${{ github.actor }}"
          REF_NAME="${{ github.ref_name }}"
          SERVER_URL="${{ github.server_url }}"

          if [ "$EVENT" = "push" ]; then
            COMPARE_URL="${SERVER_URL}/${REPO}/compare/${{ github.event.before }}...${{ github.sha }}"
            NOTES=$(echo '${{ toJson(github.event.commits) }}' | jq -r '.[0:5] | map("• " + (.message|split("\n")[0])) | join("\n")')
            [ -z "$NOTES" ] && NOTES="（无）"

            payload=$(jq -n \
              --arg username "VIBECHECK" \
              --arg title "✅ VIBECHECK 推送成功" \
              --arg desc "**${REPO}**\n👤 ${ACTOR} pushed to **${REF_NAME}**\n🔗 ${COMPARE_URL}" \
              --arg notes "$NOTES" \
              '{
                username: $username,
                embeds: [{
                  title: $title,
                  description: $desc,
                  color: 5814783,
                  fields: [{name: "📝 提交内容 / Commits", value: $notes}],
                  timestamp: (now | todateiso8601)
                }]
              }')

          elif [ "$EVENT" = "release" ]; then
            REL_TAG='${{ github.event.release.tag_name }}'
            REL_NAME='${{ github.event.release.name }}'
            REL_URL='${{ github.event.release.html_url }}'
            BODY_RAW='${{ github.event.release.body }}'

            BODY=$(printf "%s" "$BODY_RAW" | head -c 900)
            [ -z "$BODY" ] && BODY="（没有填写 Release Notes）"

            payload=$(jq -n \
              --arg username "VIBECHECK" \
              --arg title "🚀 VIBECHECK 发布成功" \
              --arg desc "**${REPO}** 发布新版本：**'"$REL_TAG"'**\n'"$REL_NAME"'\n🔗 '"$REL_URL"'' \
              --arg notes "$BODY" \
              '{
                username: $username,
                embeds: [{
                  title: $title,
                  description: $desc,
                  color: 5814783,
                  fields: [{name: "📝 更新说明 / Release notes", value: $notes}],
                  timestamp: (now | todateiso8601)
                }]
              }')
          else
            echo "Skip: unsupported event $EVENT"
            exit 0
          fi

          echo "Payload preview:"
          echo "$payload" | jq .

          echo "Sending to Discord..."
          http_code=$(curl -sS -o /tmp/discord_resp.txt -w "%{http_code}" \
            -H "Content-Type: application/json" \
            -d "$payload" \
            "$DISCORD_WEBHOOK_URL" || true)

          echo "Discord HTTP code: $http_code"
          echo "Discord response:"
          cat /tmp/discord_resp.txt || true

          if [ "$http_code" -lt 200 ] || [ "$http_code" -ge 300 ]; then
            echo "ERROR: Discord webhook call failed"
            exit 2
          fi

          echo "✅ Done"
