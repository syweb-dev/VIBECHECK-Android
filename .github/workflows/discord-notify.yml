name: Discord Notify

on:
  push:
    branches:
      - main
      - master
  release:
    types: [published]

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Send Discord notification
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          EVENT_NAME: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          ACTOR: ${{ github.actor }}
          REF_NAME: ${{ github.ref_name }}
          SERVER_URL: ${{ github.server_url }}
        run: |
          set -e

          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "Missing DISCORD_WEBHOOK_URL secret"
            exit 1
          fi

          if [ "$EVENT_NAME" = "push" ]; then
            COMPARE_URL="${SERVER_URL}/${REPO}/compare/${{ github.event.before }}...${{ github.sha }}"
            TITLE="📌 代码更新 / Code Update"
            DESC="**${REPO}**\n👤 ${ACTOR} pushed to **${REF_NAME}**\n🔗 ${COMPARE_URL}"

            # 取最近 5 条 commit message
            NOTES="$(printf '%s\n' '${{ toJson(github.event.commits) }}' \
              | python3 -c 'import json,sys; c=json.loads(sys.stdin.read()); 
                msgs=[x.get("message","") for x in c][:5];
                print("\n".join([f"• {m.splitlines()[0]}" for m in msgs]) if msgs else "（无）")')"

            payload=$(cat <<EOF
          {
            "username": "游戏更新提醒",
            "embeds": [{
              "title": "${TITLE}",
              "description": "${DESC}",
              "color": 5814783,
              "fields": [{
                "name": "📝 更新详情 / Update notes",
                "value": "${NOTES}"
              }],
              "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            }]
          }
          EOF
          )

          elif [ "$EVENT_NAME" = "release" ]; then
            REL_NAME="${{ github.event.release.name }}"
            REL_TAG="${{ github.event.release.tag_name }}"
            REL_URL="${{ github.event.release.html_url }}"

            # Release Notes 可能很长，截断一下（Discord embed 有长度限制）
            BODY="$(printf '%s' '${{ github.event.release.body }}' | head -c 900)"
            [ -z "$BODY" ] && BODY="（没有填写 Release Notes）"

            TITLE="🎮 游戏更新了 / Game Updated"
            DESC="**${REPO}** 发布新版本：**${REL_TAG}**\n${REL_NAME}\n🔗 ${REL_URL}"

            payload=$(cat <<EOF
          {
            "username": "游戏更新提醒",
            "embeds": [{
              "title": "${TITLE}",
              "description": "${DESC}",
              "color": 5814783,
              "fields": [{
                "name": "📝 更改详情 / Update notes",
                "value": "${BODY}"
              }],
              "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            }]
          }
          EOF
          )
          else
            echo "Unsupported event: $EVENT_NAME"
            exit 0
          fi

          curl -sS -X POST \
            -H "Content-Type: application/json" \
            -d "$payload" \
            "$DISCORD_WEBHOOK_URL"
