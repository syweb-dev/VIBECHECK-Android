name: Discord Notify

on:
  push:
    branches: [ main, master ]

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Send Discord notification
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        shell: bash
        run: |
          set -Eeuo pipefail

          if [ -z "${DISCORD_WEBHOOK_URL:-}" ]; then
            echo "ERROR: Missing DISCORD_WEBHOOK_URL secret"
            exit 2
          fi

          sudo apt-get update -y >/dev/null
          sudo apt-get install -y jq >/dev/null

          REPO="${{ github.repository }}"
          ACTOR="${{ github.actor }}"
          REF_NAME="${{ github.ref_name }}"
          SERVER_URL="${{ github.server_url }}"
          COMPARE_URL="${SERVER_URL}/${REPO}/compare/${{ github.event.before }}...${{ github.sha }}"

          NOTES=$(echo '${{ toJson(github.event.commits) }}' | jq -r '.[0:5] | map("• " + (.message|split("\n")[0])) | join("\n")')
          [ -z "$NOTES" ] && NOTES="（无）"

          DESC="**${REPO}**\n👤 ${ACTOR} pushed to **${REF_NAME}**\n🔗 ${COMPARE_URL}"

          payload=$(jq -n \
            --arg username "VIBECHECK" \
            --arg title "✅ VIBECHECK 推送成功" \
            --arg desc "$DESC" \
            --arg notes "$NOTES" \
            '{
              username: $username,
              embeds: [{
                title: $title,
                description: $desc,
                color: 5814783,
                fields: [
                  { name: "📝 提交内容 / Commits", value: $notes }
                ],
                timestamp: (now | todateiso8601)
              }]
            }')

          http_code=$(curl -sS -o /tmp/discord_resp.txt -w "%{http_code}" \
            -H "Content-Type: application/json" \
            -d "$payload" \
            "$DISCORD_WEBHOOK_URL" || true)

          echo "Discord HTTP code: $http_code"
          cat /tmp/discord_resp.txt || true

          if [ "$http_code" -lt 200 ] || [ "$http_code" -ge 300 ]; then
            echo "ERROR: Discord webhook call failed"
            exit 2
          fi
